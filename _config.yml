# ==========================================
# 3. ASSETS & THEME
# ==========================================
logo: /assets/head_shot.webp
theme: jekyll-theme-minimal

# ==========================================
# 4. BUILD PLUGINS
# ==========================================
# jekyll-seo-tag is intentionally removed to avoid tag collision.
plugins:
  - jekyll-sitemap


# ==========================================
# 5. BUILD EXCLUSIONS
# ==========================================
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules

