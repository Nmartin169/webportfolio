    <!-- 8. THEME STYLES & SWITCHER                -->
    <!-- ========================================== -->
    <style>
      :root {
        --bg-color: #ffffff;
        --text-color: #333333;
        --link-color: #007bff;
        --code-bg: #f5f5f5;
        --blockquote-color: #828282;
        --blockquote-border: #e8e8e8;
        --heading-color: #333;
      }

      [data-theme="dark"] {
        --bg-color: #0d1117;
        --text-color: #c9d1d9;
        --link-color: #58a6ff;
        --code-bg: #161b22;
        --blockquote-color: #8b949e;
        --blockquote-border: #30363d;
        --heading-color: #ffffff;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        transition: background-color 0.43s, color 0.43s;
      }

      h1, h2, h3, h4, h5, h6 { color: var(--heading-color); }
      header h1 a { color: var(--heading-color); }
      a { color: var(--link-color); }

      blockquote {
        color: var(--blockquote-color);
        border-left: 4px solid var(--blockquote-border);
      }

      code, pre { background-color: var(--code-bg); }

      .theme-toggle-btn {
        position: absolute;
        top: 22.5px;
        right: 22.5px;
        background: transparent;
        border: none;
        padding: 0;
        cursor: pointer;
        z-index: 1000;
        opacity: 1;
        transition: transform 0.43s ease, opacity 0.33s ease;
      }

      .theme-toggle-btn img {
        width: 22.5px;
        height: 22.5px;
        display: block;
      }

      .theme-toggle-btn:hover { opacity: 0.8; }

      .theme-toggle-btn.is-transitioning {
        opacity: 0.5;
        pointer-events: none;
      }

      .theme-toggle-btn.is-animating {
        transform: rotate(180deg) scale(0.8);
      }

      header img.logo-img {
        border-radius: 50%;
        margin-bottom: 12px;
      }

      header h1 { margin-top: 0; }

      @media (max-width: 768px) {
        .theme-toggle-btn {
          top: 10px;
          right: 10px;
        }
      }

      .light-img { display: inline; }
      .dark-img { display: none; }

      [data-theme="dark"] .light-img { display: none; }
      [data-theme="dark"] .dark-img { display: inline; }
    </style>

    <script>
      // Immediate theme detection to prevent flashing
      const savedTheme = localStorage.getItem('theme');
      if (!savedTheme || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
    </script>
