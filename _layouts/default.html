<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="thumbnail" content="{{ site.url }}{{ site.baseurl }}/assets/preview.png">
    <meta name="robots" content="index, follow, max-image-preview:large">

    <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
    <meta property="og:site_name" content="{{ site.title }}">

    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:image" content="{{ "/assets/preview.png" | absolute_url }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title | default: site.title }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description }}">
    <meta name="twitter:image" content="{{ "/assets/preview.png" | absolute_url }}">

    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Ikenna M. D. Nwankwo",
      "url": "{{ site.url }}{{ site.baseurl }}",
      "image": "{{ "/assets/preview.png" | absolute_url }}",
      "jobTitle": "Data Analyst & Business Strategy Researcher",
      "description": "Portfolio showcasing Data Analytics, Research, and Business Strategy Projects.",
      "knowsAbout": ["Data Analytics", "Business Strategy", "Research"]
    }
    </script>

    <style>
      :root {
        --bg-color: #ffffff;
        --text-color: #333333;
        --link-color: #007bff;
        --code-bg: #f5f5f5;
        --blockquote-color: #828282;
        --blockquote-border: #e8e8e8;
        --heading-color: #333;
      }

      [data-theme="dark"] {
        --bg-color: #0d1117;
        --text-color: #c9d1d9;
        --link-color: #58a6ff;
        --code-bg: #161b22;
        --blockquote-color: #8b949e;
        --blockquote-border: #30363d;
        --heading-color: #ffffff;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        transition: background-color 0.43s, color 0.43s;
      }

      h1, h2, h3, h4, h5, h6 { color: var(--heading-color); }
      header h1 a { color: var(--heading-color); text-decoration: none; }
      a { color: var(--link-color); }

      blockquote {
        color: var(--blockquote-color);
        border-left: 4px solid var(--blockquote-border);
        padding-left: 15px;
        margin-left: 0;
      }

      code, pre { background-color: var(--code-bg); padding: 2px 5px; border-radius: 3px; }

      .theme-toggle-btn {
        position: absolute;
        top: 22.5px;
        right: 22.5px;
        background: transparent;
        border: none;
        padding: 0;
        cursor: pointer;
        z-index: 1000;
      }

      .theme-toggle-btn img {
        width: 22.5px;
        height: 22.5px;
        display: block;
        transition: transform 0.43s ease;
      }

      .theme-toggle-btn.is-animating img {
        transform: rotate(180deg) scale(0.8);
      }

      header img.logo-img {
        border-radius: 50%;
        margin-bottom: 12px;
      }

      @media (max-width: 768px) {
        .theme-toggle-btn { top: 10px; right: 10px; }
      }
    </style>

    <script>
      const savedTheme = localStorage.getItem('theme') || 'dark';
      if (savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
  </head>

  <body>
    <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">
      <img id="theme-icon" src="" alt="Toggle theme">
    </button>

    <div class="wrapper">
      <header>
        {% if site.logo %}
          <a href="{{ "/" | relative_url }}">
            <img src="{{ site.logo | relative_url }}" alt="Logo" class="logo-img" width="100">
          </a>
        {% endif %}

        <h1>
          <a href="{{ "/" | relative_url }}">
            {{ site.title | default: site.github.repository_name }}
          </a>
        </h1>

        {% if site.description %}
          <p>{{ site.description }}</p>
        {% endif %}
      </header>

      <main>
        <section>
          {{ content }}
        </section>
      </main>

      <footer>
        <p><small>Hosted on GitHub Pages — Theme by <a href="https://github.com/orderedlist">orderedlist</a></small></p>
      </footer>
    </div>

    <script>
      const toggleBtn = document.getElementById('theme-toggle');
      const icon = document.getElementById('theme-icon');
      
      // Paths for icons
      const sunIcon = '{{ "/assets/dark_sun.png" | relative_url }}';
      const moonIcon = '{{ "/assets/light_moon.png" | relative_url }}';

      // Set initial icon based on theme
      const updateIcon = () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        icon.src = isDark ? sunIcon : moonIcon;
      };

      updateIcon();

      toggleBtn.addEventListener('click', () => {
        toggleBtn.classList.add('is-animating');
        
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';

        if (isDark) {
          document.documentElement.removeAttribute('data-theme');
          localStorage.setItem('theme', 'light');
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          localStorage.setItem('theme', 'dark');
        }

        updateIcon();

        setTimeout(() => {
          toggleBtn.classList.remove('is-animating');
        }, 450);
      });
    </script>
  </body>
</html>
